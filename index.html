const {useState,useEffect,useRef}=React,html=htm.bind(React.createElement);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const NODES=[
{id:'fw',en:'Router / Firewall',ar:'الراوتر والجدار الناري',x:690,y:165,loc:'غرفة التحكم',sn:'FW-48213',mt:'2026-09-14'},

const NM={};NODES.forEach(n=>NM[n.id]=n);
const EDGES=[['fw','sw','d'],['sw','ap','d'],['sw','nvr','d'],['nvr','cam','d'],['sw','led','d'],['sw','pc','d'],['ups','fw','p'],['ups','sw','p'],['ups','nvr','p'],['ups','led','p']];

const EXTRA={'مهرجان':{ap:'تغطية Wi‑Fi للزوار',cam:'كاميرات المداخل والمواقف',ups:'تعبئة وقود المولد'},'مؤتمر':{led:'شاشة العرض الرئيسية',ap:'إنترنت مخصص للقاعة',pc:'طاولة التسجيل'},'معرض':{ap:'شبكة الأجنحة',led:'شاشات الأجنحة',ups:'نقاط الكهرباء للأجنحة'},'احتفال':{led:'شاشة المسرح',ups:'إضاءة وصوت المسرح',cam:'تأمين منطقة الضيوف'},'حملة ميدانية':{ap:'راوتر متنقل 5G',pc:'حقيبة الأجهزة الميدانية',ups:'بطاريات محمولة'}};

function gen(type,frac){const off=OFF[type]||[],items=[];
 NODES.forEach(n=>{if(off.includes(n.id))return;const t=[...BASE[n.id]],x=EXTRA[type][n.id];if(x)t.push(x);t.forEach((l,i)=>items.push({id:n.id+i,node:n.id,label:l,s:'todo',who:NOWN[n.id]}))});
 const k=Math.round(items.length*frac);items.forEach((it,i)=>{it.s=i<k?'done':i<k+2?'prog':'todo'});
 if(frac<.9&&items.length>k+3)items[items.length-1].s='late';return items}

 return{ns,aff,pct,zh,eff:Math.round(pct*(act-dn)/act*zf),st:pct===100&&!bad&&!zb&&!zh.weak?'ready':bad||zb?'short':'prog'}}
function qr(seed,n=21){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;let r='';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);let on;
